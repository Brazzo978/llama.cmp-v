name: CMP documentation

on:
  push:
    branches: [main]
    paths:
      - 'cmp/docs/**'
      - 'cmp/mkdocs.yml'
      - 'cmp/docs-requirements.txt'
      - '.github/workflows/cmp-docs.yml'
  pull_request:
    paths:
      - 'cmp/docs/**'
      - 'cmp/mkdocs.yml'
      - 'cmp/docs-requirements.txt'
      - '.github/workflows/cmp-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmp-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cmp/docs-requirements.txt
      - name: Install documentation dependencies
        run: pip install -r cmp/docs-requirements.txt
      - name: Build the site
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: mkdocs build -f cmp/mkdocs.yml --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cmp/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
